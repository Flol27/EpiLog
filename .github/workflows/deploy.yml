name: Build & Deploy Next.js (Standalone)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2200 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy code to server
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='.next' \
            -e "ssh -p 2200 -i ~/.ssh/id_rsa" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_DIR }}/

      - name: Install, migrate & start
        run: |
          ssh -p 2200 -i ~/.ssh/id_rsa \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ secrets.TARGET_DIR }}
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart epilog || pm2 start .next/standalone/server.js --name epilog
          EOF
